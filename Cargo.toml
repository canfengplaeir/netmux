[workspace]
resolver = "2"
members = [
    "crates/netmux-core",
    "crates/netmux-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
log = { package = "log", version = "0.4" }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
nix = { version = "0.29", features = ["socket", "net", "ioctl", "feature", "poll"] }
if-addrs = "0.13"
once_cell = "1"
parking_lot = "0.12"
binary-heap-plus = "0.5"